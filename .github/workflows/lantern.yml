name: lantern

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "GitLab ref (branch or tag)"
        required: false
        default: "main"
      upload:
        description: "Ship to TestFlight"
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types: [lantern-push, lantern-release]

concurrency:
  group: relay-lantern-${{ github.event.client_payload.ref || github.event.inputs.ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/ios-build.yml
    with:
      app_name: Lantern
      gitlab_path: hayden/intel-dashboard
      project_path: ios/Lantern.xcodeproj
      scheme: Lantern
      ref: ${{ github.event.client_payload.ref || github.event.inputs.ref || 'main' }}
      upload: >-
        ${{ github.event.action == 'lantern-release'
            || github.event.inputs.upload == 'true' }}
    secrets: inherit
