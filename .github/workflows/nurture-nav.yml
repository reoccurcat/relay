# Caller workflow for the shared iOS pipeline.
#
# Lives at .github/workflows/nurture-nav.yml in reoccurcat/relay. Kept in-repo so
# the app's build contract is reviewable alongside the app.
#
# Source is on GitLab, so there is no push trigger here — GitLab fires a
# repository_dispatch into this repo. Matches studio.yml / lantern.yml exactly.

name: nurture-nav

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "GitLab ref (branch or tag)"
        required: false
        default: "main"
      upload:
        description: "Ship to TestFlight"
        type: boolean
        required: false
        default: false
      package_only:
        description: "Build and package the IPA but do not send it to Apple"
        type: boolean
        required: false
        default: false
      keep_watch_in_plugins:
        description: "Leave the watch app in PlugIns/ rather than moving it to Watch/"
        type: boolean
        required: false
        default: false
      export_probe:
        description: "Try xcodebuild -exportArchive under every Xcode on the runner"
        type: boolean
        required: false
        default: false
  repository_dispatch:
    types: [nurture-nav-push, nurture-nav-release]

concurrency:
  group: relay-nurture-nav-${{ github.event.client_payload.ref || github.event.inputs.ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/ios-build.yml
    with:
      app_name: NurtureNav
      gitlab_path: nurture-labs-llc/nurture-nav
      project_path: ios/NurtureNav.xcodeproj
      scheme: NurtureNav
      ref: ${{ github.event.client_payload.ref || github.event.inputs.ref || 'main' }}
      # TestFlight only on a release dispatch or an explicit manual tick.
      upload: >-
        ${{ github.event.action == 'nurture-nav-release'
            || github.event.inputs.upload == 'true' }}
      # The suite lives in ios/Package.swift and runs natively via `swift test`
      # on every build, release included — it costs seconds and needs no
      # simulator. run_tests stays false so xcodebuild never boots one: the
      # non-upload path compiles for a device destination instead, which catches
      # the same breakage. This also lets push and release share one warm
      # DerivedData cache, since both now build Release-iphoneos.
      run_tests: false
      package_path: ios
      # Hand packaging is off again, and the whole apparatus behind it was built
      # on a misdiagnosis.
      #
      # It existed because IDEDistribution reported no valid distribution
      # methods for an archive containing a watch app, which was read as an
      # Xcode 26 defect. export_probe put that to the test against every Xcode
      # on the image: 16.0 through 26.3 all failed identically, which no 26.x
      # regression can explain. The archive was carrying two installable
      # products, because the watch target was missing SKIP_INSTALL. One line in
      # the project, and all twenty exporters succeed.
      #
      # It was briefly switched off on the strength of that, and switched back:
      # xcodebuild's export leaves the watch app in PlugIns/, and App Store
      # Connect refuses it at upload with "not contained in a correctly named
      # directory. It should be under Watch." Xcode 26's own app-store-connect
      # output is not something the store accepts.
      #
      # So the packaging step was doing two jobs, and only one of them has gone
      # away. It stood in for an exporter believed broken — unnecessary now —
      # and it puts the bundle where the store wants it, which is still the only
      # thing that does. The same rejection also explains altool's "Cannot
      # determine the platform" on an exported IPA: it classified build 110
      # without complaint, and that one had Watch/ and the stub.
      export_by_hand: true
      asc_app_id: "6796454127"
      # An IPA carrying a watch app holds two platforms, and fastlane's uploader
      # cannot state which — it passes app_platform:"ios" and altool still
      # answers "Cannot determine the platform". Ambiguity, not absence.
      # `altool --upload-app -t ios` says it outright.
      upload_with_altool: true
      # Watch/ without the stub — the one arrangement never tried. PlugIns/ with
      # no stub is refused at upload; Watch/ with the stub is accepted and then
      # refused asynchronously with ITMS-90486. Dropping the stub was ruled out
      # by a search about apps with a watch *extension*, which this is not, and
      # Xcode's own export of this archive writes no stub at all.
      skip_watchkit_stub: true
      # Every nested bundle needs its own App Store profile, or packaging signs it
      # with none and Apple refuses the upload: "Invalid Provisioning Profile ...
      # in the io.nurturelabs.nav.widgets bundle". The widget extension was added
      # in 0.3.32 and this list was not, which cost build 142.
      resign_bundle_ids: >-
        io.nurturelabs.nav
        io.nurturelabs.nav.watchkitapp
        io.nurturelabs.nav.widgets
      # actool needs a watchOS *simulator* runtime even for a device build, and
      # the macos-15 image does not ship one matching Xcode 26's watchsimulator
      # SDK. Several gigabytes, and it fails transiently with "Unable to connect
      # to simulator", so the step retries.
      #
      # This was removed once on the reasoning that the watch app did not need an
      # asset catalog at all — that only export validation wanted the icon, and
      # packaging by hand had removed export validation. Half right: App Store
      # Connect validates too, and refuses the upload outright with "Missing
      # Icons" and "A value for the Info.plist key 'CFBundleIconName' is
      # missing". The icon is not optional, so neither is this.
      download_platforms: watchOS
      # Manual runs only — a dispatch cannot set this on a tag build, so
      # releases are unaffected. Ticking it stops after packaging and attaches
      # the IPA, which is the fast way to work on bundle layout: no upload, no
      # processing wait, no rejection email, and the whole archive to inspect
      # rather than whichever fault Apple mentioned first.
      #
      # A probe implies package_only: it answers its question from the archive
      # and must never reach Apple, whatever the upload tick says.
      package_only: >-
        ${{ github.event.inputs.package_only == 'true'
            || github.event.inputs.export_probe == 'true' }}
      keep_watch_in_plugins: ${{ github.event.inputs.keep_watch_in_plugins == 'true' }}
      export_probe: ${{ github.event.inputs.export_probe == 'true' }}
    secrets: inherit
