name: macos-relay

# Opens a WireGuard-reachable interactive session on a GitHub-hosted macOS runner
# for `hours` hours, so you can drive Music.app (iTunes Match custom-audio upload)
# over the tunnel. Runner joins your WG net as 10.200.0.11.
#
# Secrets required (already set on reoccurcat/relay):
#   WG_PRIVATE_KEY  - this runner/client's WireGuard private key (matches 10.200.0.11)
#   WG_PUBLIC_KEY   - your WG SERVER's public key  (Peer.PublicKey)
#   WG_ENDPOINT     - your WG server host:port      (Peer.Endpoint)
#   TEAM_ID         - not used by this workflow (leave as-is)

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Session length in hours (max 5.5 — GitHub caps a single job at 6h)"
        required: true
        default: "3"

jobs:
  relay:
    runs-on: macos-13          # Intel/VMware image; app windows composite (arm64 macos-14 = VZ backing-store bug)
    timeout-minutes: 355       # just under the 6h hard cap
    permissions:
      contents: write          # for the GITHUB_TOKEN to store state as a release asset
    steps:
      - name: Clamp session length
        id: t
        run: |
          H="${{ github.event.inputs.hours }}"
          [[ "$H" =~ ^[0-9]+([.][0-9]+)?$ ]] || { echo "hours must be numeric"; exit 1; }
          SEC=$(python3 -c "print(min(int(float('$H')*3600), 5*3600+1800))")
          echo "seconds=$SEC" >> "$GITHUB_OUTPUT"
          echo "Holding session for ${SEC}s"

      - name: Install WireGuard
        run: brew install wireguard-tools wireguard-go

      - name: Bring up tunnel
        run: |
          umask 077
          cat > wg0.conf <<EOF
          [Interface]
          PrivateKey = ${{ secrets.WG_PRIVATE_KEY }}
          Address = 10.200.0.11/32
          DNS = 1.1.1.1

          [Peer]
          PublicKey = ${{ secrets.WG_PUBLIC_KEY }}
          Endpoint = ${{ secrets.WG_ENDPOINT }}
          AllowedIPs = 192.168.0.0/16,10.200.0.0/24
          PersistentKeepalive = 25
          EOF
          sudo mkdir -p /etc/wireguard
          sudo mv wg0.conf /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          sudo wg show

      - name: Enable SSH (key auth) + Screen Sharing
        run: |
          # The runner account has a SecureToken -> its password can't be reset (eDSAuthFailed),
          # so SSH uses a generated KEY instead of a password.
          ssh-keygen -t ed25519 -N '' -q -f "$RUNNER_TEMP/relay_key"
          sudo mkdir -p /Users/runner/.ssh
          sudo tee -a /Users/runner/.ssh/authorized_keys < "$RUNNER_TEMP/relay_key.pub" >/dev/null
          sudo chown -R runner:staff /Users/runner/.ssh
          sudo chmod 700 /Users/runner/.ssh && sudo chmod 600 /Users/runner/.ssh/authorized_keys
          sudo systemsetup -setremotelogin on || true

          # VNC legacy password is independent of the account password -> works despite eDSAuthFailed.
          PW=$(python3 -c "import secrets,string;print(''.join(secrets.choice(string.ascii_letters+string.digits) for _ in range(8)))")
          sudo defaults write /Library/Preferences/com.apple.RemoteManagement VNCLegacyConnectionsEnabled -bool yes || true
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on -restart -agent -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$PW" || true
          # kickstart alone doesn't bind :5900 on the CI image — force the daemon to (re)start:
          sudo launchctl enable system/com.apple.screensharing 2>/dev/null || true
          sudo launchctl kickstart -k system/com.apple.screensharing 2>/dev/null || true
          # attach ARD to the pre-logged-in CONSOLE session — THIS is what avoids the black screen
          # (share the real desktop, not a headless virtual session). Needs a user at the console.
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart -restart -agent -console 2>/dev/null || true
          echo "console user = $(stat -f%Su /dev/console)   (if 'root' at loginwindow, no desktop is logged in -> still black)"

          # Emit creds to the (PUBLIC) log ONLY as ciphertext. Decrypt locally with:
          #   openssl enc -d -aes-256-cbc -pbkdf2 -a -pass pass:reoccurcat
          echo "::add-mask::$PW"
          { echo "# 1) save the key below as relay_key ; chmod 600 relay_key";
            echo "# 2) screen-share over ssh:";
            echo "#    ssh -i relay_key -N -L 5900:127.0.0.1:5900 runner@10.200.0.11 &";
            echo "# 3) point any VNC client at 127.0.0.1:5900  (legacy password below)";
            echo "# plain ssh shell:  ssh -i relay_key runner@10.200.0.11";
            echo "vnc-legacy-password: $PW";
            echo "----- ssh private key (relay_key) -----";
            cat "$RUNNER_TEMP/relay_key"; } > "$RUNNER_TEMP/creds.txt"
          echo "=== RELAY_CREDS_ENC (decrypt: openssl enc -d -aes-256-cbc -pbkdf2 -a -pass pass:reoccurcat) ==="
          openssl enc -aes-256-cbc -pbkdf2 -a -salt -pass pass:reoccurcat -in "$RUNNER_TEMP/creds.txt"
          echo "=== END RELAY_CREDS_ENC ==="

      - name: Restore Music/auth state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          KEY="${STATE_KEY:-reoccurcat}"
          [ -z "${STATE_KEY:-}" ] && echo "::warning::STATE_KEY secret unset — Apple-auth state will use the weak fallback key 'reoccurcat'. Set a strong STATE_KEY secret."
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          url=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/music-state" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);d=d if isinstance(d,dict) else {};a=[x for x in d.get('assets',[]) if x['name']=='state.tgz.enc'];print(a[0]['url'] if a else '')")
          if [ -n "$url" ]; then
            osascript -e 'tell application "Music" to quit' 2>/dev/null || true; sleep 2
            curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" "$url" -o /tmp/state.enc
            if openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$KEY" -in /tmp/state.enc | tar -xzf - -C "$HOME" 2>/tmp/restore.err; then
              echo "state restored ($(wc -c </tmp/state.enc) bytes)"
            else
              echo "::warning::state restore failed (bad key/corrupt): $(tail -1 /tmp/restore.err 2>/dev/null)"
            fi
          else
            echo "no prior state — first run"
          fi

      - name: Hold session open
        run: |
          echo "Interactive session live at 10.200.0.11 for ${{ steps.t.outputs.seconds }}s"
          END=$(( $(date +%s) + ${{ steps.t.outputs.seconds }} ))
          while [ "$(date +%s)" -lt "$END" ]; do
            echo "alive $(date -u +%H:%M:%S)Z — $(( (END-$(date +%s))/60 )) min left"
            sleep 60
          done

      - name: Save Music/auth state
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
        run: |
          KEY="${STATE_KEY:-reoccurcat}"
          osascript -e 'tell application "Music" to quit' 2>/dev/null || true; sleep 2
          cd "$HOME"
          CAND=(Library/Keychains Library/Accounts \
                "Library/Preferences/MobileMeAccounts.plist" \
                "Library/Preferences/com.apple.Music.plist" \
                Library/Containers/com.apple.Music \
                Library/Containers/com.apple.akd \
                "Music/Music/Music Library.musiclibrary")
          KEEP=(); for p in "${CAND[@]}"; do [ -e "$p" ] && KEEP+=("$p"); done
          if [ ${#KEEP[@]} -eq 0 ]; then echo "nothing to save"; exit 0; fi
          tar -czf - "${KEEP[@]}" 2>/dev/null | openssl enc -aes-256-cbc -pbkdf2 -salt -pass pass:"$KEY" -out /tmp/state.enc
          echo "state blob: $(wc -c </tmp/state.enc) bytes from ${#KEEP[@]} paths"
          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          rid=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$api/releases/tags/music-state" | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('id','') if isinstance(d,dict) else '')")
          if [ -z "$rid" ]; then
            rid=$(curl -sSL -X POST -H "Authorization: Bearer $GH_TOKEN" "$api/releases" \
                  -d '{"tag_name":"music-state","name":"music-state","prerelease":true}' \
                  | python3 -c "import sys,json;print(json.load(sys.stdin).get('id',''))")
          fi
          if [ -z "$rid" ]; then echo "::warning::could not get/create music-state release"; exit 0; fi
          oldid=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" "$api/releases/$rid/assets" | python3 -c "import sys,json;a=[x for x in json.load(sys.stdin) if x['name']=='state.tgz.enc'];print(a[0]['id'] if a else '')")
          [ -n "$oldid" ] && curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$api/releases/assets/$oldid" >/dev/null
          code=$(curl -sS -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" --data-binary @/tmp/state.enc \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$rid/assets?name=state.tgz.enc")
          echo "asset upload HTTP $code"

      - name: Tear down tunnel
        if: always()
        run: sudo wg-quick down wg0 || true
