name: ios-build

on:
  workflow_call:
    inputs:
      app_name:
        description: "Short name for archive/artifact naming, e.g. Studio"
        required: true
        type: string
      gitlab_path:
        description: "namespace/project on the GitLab host"
        required: true
        type: string
      project_path:
        description: ".xcodeproj or .xcworkspace path, relative to repo root"
        required: true
        type: string
      scheme:
        required: true
        type: string
      ref:
        description: "GitLab ref to build (branch or tag)"
        required: false
        type: string
        default: "main"
      gitlab_host:
        required: false
        type: string
        default: "gitlab.nurture-labs.io"
      xcode_version:
        required: false
        type: string
        default: "26.0"
      # Space-separated platforms to fetch before building, e.g. "watchOS".
      #
      # The runner image ships Xcode with every platform SDK but not every
      # simulator *runtime*, and actool consults the runtime even when compiling
      # an asset catalog for a device — so a watchOS app's icons fail to compile
      # with "No simulator runtime version ... available to use with
      # watchsimulator SDK", and the build fails with the catalog present while
      # export fails on a missing icon without it.
      #
      # Empty by default because the download is several GB: only an app that
      # actually embeds another platform should pay for it.
      download_platforms:
        required: false
        type: string
        default: ""
      # Package the IPA from the archive rather than asking xcodebuild to export
      # it. See "Package IPA from the archive" for when that is worth doing.
      export_by_hand:
        required: false
        type: boolean
        default: false
      # Numeric App Store Connect app id. Only needed alongside export_by_hand,
      # where the upload states every identifier rather than letting altool
      # work them out.
      asc_app_id:
        required: false
        type: string
        default: ""
      # Space-separated bundle identifiers to fetch App Store profiles for and
      # re-sign the hand-packaged IPA with. Only used alongside export_by_hand.
      #
      # Needed because the archive is signed for *development*: measured, not
      # assumed — a build log shows "Apple Development: … / iOS Team Provisioning
      # Profile" against both the app and its watch app. Normally -exportArchive
      # re-signs that for distribution on the way out, so an IPA packaged by hand
      # skips the only step that made it shippable and App Store Connect refuses
      # it with "Invalid Provisioning Profile … [Missing code-signing
      # certificate]".
      #
      # Order does not matter; each nested bundle is matched by its own
      # CFBundleIdentifier. Empty means package as-is, which is only correct for
      # an app that was already archived for distribution.
      resign_bundle_ids:
        required: false
        type: string
        default: ""
      # Build, package and re-sign, then stop and hand the IPA back as an
      # artifact instead of sending it to Apple.
      #
      # Iterating on packaging through real uploads costs a build, a full
      # processing wait and an ITMS rejection email per attempt, and answers
      # only the one question Apple happened to check first. The IPA itself
      # answers all of them at once and takes half the time to get.
      package_only:
        required: false
        type: boolean
        default: false
      # Leave a watch app in PlugIns/ instead of moving it to Watch/.
      #
      # Xcode 26 embeds watch apps in PlugIns/ — documented, and moving the embed
      # phase back to Watch/ fails the build outright. The store has said both
      # things: it rejected PlugIns/ with "It should be under Watch", then
      # rejected Watch/ with "the expected app is missing from ... Watch". Those
      # cannot both be about location, so this switch exists to settle which
      # rejection was really about layout and which was collateral from the
      # missing icons and the arm64e stub that build also carried.
      keep_watch_in_plugins:
        required: false
        type: boolean
        default: false
      # Ask the only question underneath all of the hand packaging: can
      # xcodebuild's own exporter handle this archive under *any* Xcode on the
      # image? See the probe step for why that is suddenly worth re-asking.
      export_probe:
        required: false
        type: boolean
        default: false
      runner:
        required: false
        type: string
        default: "macos-15"
      configuration:
        required: false
        type: string
        default: "Release"
      upload:
        description: "true = archive + sign + TestFlight. false = compile only."
        required: false
        type: boolean
        default: false
      run_tests:
        required: false
        type: boolean
        default: true
      test_destination:
        required: false
        type: string
        default: "platform=iOS Simulator,name=iPhone 16,OS=latest"
      package_path:
        description: >-
          Path (relative to the repo root) to a Swift package whose tests run
          natively with `swift test` — no simulator. Empty = no native tests.
          An app opts in by extracting its platform-agnostic sources into a
          package; see nurture-nav's ios/Package.swift for the pattern. Apps
          that set this usually also set run_tests: false, which drops the
          simulator from the pipeline entirely.
        required: false
        type: string
        default: ""
      testflight_groups:
        description: "Comma-separated external tester groups. Empty = internal testers only."
        required: false
        type: string
        default: ""
      beta_app_description:
        description: >-
          App-level Test Information text. App Store Connect requires this
          before any build reaches external testers, and without it the
          metadata step fails after the changelog has already been set.
          Set once per app; fastlane creates the betaAppLocalization.
        required: false
        type: string
        default: ""
      beta_app_feedback_email:
        description: "Where TestFlight feedback goes. Set alongside beta_app_description."
        required: false
        type: string
        default: ""

    secrets:
      GITLAB_TOKEN:
        required: true
      ASC_KEY_P8:
        required: false
      ASC_KEY_ID:
        required: false
      ASC_ISSUER_ID:
        required: false
      TEAM_ID:
        required: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90

    env:
      SPM_CACHE: ${{ github.workspace }}/.spm

    steps:
      - name: Select Xcode
        run: |
          ls /Applications | grep -i '^Xcode'
          sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode_version }}.app/Contents/Developer"
          xcodebuild -version

      # Only for apps that embed another platform — see download_platforms.
      #
      # Deliberately not solved by selecting a newer Xcode that happens to match
      # an installed runtime: 26.1.1 compiles the icons and then cannot export at
      # all, because its distribution components have never been registered on
      # this image and xcodebuild reports the set of valid export methods as
      # empty. Staying on the Xcode whose export path is known to work and
      # fetching what it lacks is the trade with fewer unknowns.
      - name: Download extra platforms
        if: inputs.download_platforms != ''
        run: |
          # Retried, because this fails transiently with "Unable to connect to
          # simulator" — the same invocation succeeds on the next run. A flaky
          # download should not read as a broken app.
          for platform in ${{ inputs.download_platforms }}; do
            ok=""
            for attempt in 1 2 3; do
              echo "downloading $platform (attempt $attempt)"
              if sudo xcodebuild -downloadPlatform "$platform"; then ok=1; break; fi
              sleep 20
            done
            if [ -z "$ok" ]; then
              echo "could not download $platform after 3 attempts"
              exit 1
            fi
          done
          xcrun simctl list runtimes | grep -i watch || true

      # Booting a simulator is the single most expensive thing in a test run —
      # measured at 150-346s, dwarfing the ~20-60s compile. It does not depend on
      # the source, so start it here and let it boot while we clone, resolve and
      # compile. The Test step then waits on whatever is left instead of all of it.
      #
      # Runtime choice matters: picking newest-available lands on a runtime that
      # lives on its own mounted CoreSimulator volume, and first touch of that
      # volume is where the 150 -> 346s variance came from. Prefer the runtime
      # matching the selected Xcode's SDK, which is already local.
      - name: Boot simulator (background)
        if: inputs.run_tests
        run: |
          set -uo pipefail
          SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)   # e.g. 26.0
          WANTED="iOS-${SDK_VERSION//./-}"                                # e.g. iOS-26-0
          echo "Xcode ships iOS SDK $SDK_VERSION; preferring runtime $WANTED"

          # jq selects the single udid itself rather than piping to `head`, which
          # would SIGPIPE jq and trip pipefail. An empty result is reported as ""
          # and handled below, so no `set -e` is wanted here.
          pick() {
            xcrun simctl list devices available --json | jq -r --arg want "$1" '
              [ .devices | to_entries[]
                | select(.key | contains("iOS"))
                | select($want == "" or (.key | contains($want)))
              ] | sort_by(.key) | reverse
                | [ .[].value[] | select(.name | startswith("iPhone")) | .udid ]
                | .[0] // ""'
          }

          UDID=$(pick "$WANTED")
          if [ -z "$UDID" ]; then
            echo "::notice::No iPhone on runtime $WANTED; falling back to newest available."
            UDID=$(pick "")
          fi
          if [ -z "$UDID" ]; then
            echo "::error::no iPhone simulator on this image"
            xcrun simctl list devices available
            exit 1
          fi

          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices available | grep -F "$UDID" || true

          # Detached: this step must return immediately so the boot overlaps the
          # build. The Test step joins via `simctl bootstatus`, which is a no-op
          # once the device is already booted.
          nohup xcrun simctl bootstatus "$UDID" -b >"$RUNNER_TEMP/simboot.log" 2>&1 &
          echo "boot started for $UDID"

      # NOTE: full history on purpose — `git rev-list --count` needs it.
      # --depth 1 would make every build number 1.
      - name: Clone source from GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --branch "${{ inputs.ref }}" \
            "https://oauth2:${GITLAB_TOKEN}@${{ inputs.gitlab_host }}/${{ inputs.gitlab_path }}.git" src
          cd src && git log -1 --oneline

          # Deterministic mtimes (last-commit time per file): a fresh clone
          # stamps "now" on everything, which makes Xcode's incremental build
          # database treat every file as changed and defeats the DerivedData
          # cache. With commit-time mtimes, unchanged files keep identical
          # stats across runs and skip recompilation.
          python3 - <<'PY'
          import subprocess, os
          # Newest-first walk of the log; the first commit that names a file
          # is that file's last change. Format record and file list are read
          # as separate lines, which sidesteps -z quirks entirely.
          stamped = {}
          current = None
          log = subprocess.check_output(
              ["git", "log", "--format=commit:%ct", "--name-only"]
          ).decode("utf-8", "replace")
          for line in log.splitlines():
              if line.startswith("commit:"):
                  current = int(line[7:])
              elif line and current is not None and line not in stamped:
                  stamped[line] = current
          restored = 0
          for path, ts in stamped.items():
              try:
                  os.utime(path, (ts, ts))
                  restored += 1
              except OSError:
                  pass
          print(f"restored mtimes for {restored} files")
          PY

      - name: Resolve project flags
        id: proj
        working-directory: src
        run: |
          P="${{ inputs.project_path }}"
          test -e "$P" || { echo "::error::$P not found in repo"; exit 1; }
          case "$P" in
            *.xcworkspace) echo "flag=-workspace" >> "$GITHUB_OUTPUT" ;;
            *.xcodeproj)   echo "flag=-project"   >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::project_path must end in .xcodeproj or .xcworkspace"; exit 1 ;;
          esac
          echo "dir=$(dirname "$P")" >> "$GITHUB_OUTPUT"

      - name: Compute version and changelog
        id: ver
        working-directory: src
        run: |
          # Monotonic and reproducible: the same commit always yields the same build number.
          BUILD_NUM=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          echo "build=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          # Marketing version: the tag when building one, otherwise the most
          # recent tag reachable from HEAD.
          #
          # "Leave the project alone" was the wrong default. project.pbxproj
          # keeps whatever MARKETING_VERSION was last committed, and since the
          # tag became the source of truth nobody edits it - so a manual
          # dispatch shipped stamped with a stale number. Build 47, the newest
          # binary at the time, went to TestFlight labelled 1.5.1 while 1.5.7
          # was already out. A version list where newer builds wear older
          # numbers is worse than one that repeats a number.
          #
          # Falling back to the last tag says "based on 1.6.0", which is true
          # and sorts correctly. App Store Connect distinguishes builds by build
          # number anyway, and that is derived from the commit count.
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            TAG=$(git describe --exact-match --tags HEAD)
            echo "marketing=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "version from exact tag: ${TAG#v}"
          else
            LAST=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
            if [ -n "$LAST" ]; then
              echo "marketing=${LAST#v}" >> "$GITHUB_OUTPUT"
              echo "no tag on HEAD; using most recent reachable tag: ${LAST#v}"
            else
              # No tags at all. Only here is leaving the project's value alone
              # correct, because there is nothing better to say.
              echo "marketing=" >> "$GITHUB_OUTPUT"
              echo "::warning::No tags reachable from HEAD, so MARKETING_VERSION is left at whatever project.pbxproj carries. Tag a release to control the version."
            fi
          fi

          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            echo "Changes since $PREV:" > "$RUNNER_TEMP/changelog.md"
            git log --no-merges --pretty='- %s' "$PREV"..HEAD >> "$RUNNER_TEMP/changelog.md"
          else
            echo "Recent changes:" > "$RUNNER_TEMP/changelog.md"
            git log --no-merges --pretty='- %s' -20 >> "$RUNNER_TEMP/changelog.md"
          fi

          # TestFlight caps "What to Test" at 4000 characters.
          head -c 3900 "$RUNNER_TEMP/changelog.md" > "$RUNNER_TEMP/changelog.trunc.md"
          mv "$RUNNER_TEMP/changelog.trunc.md" "$RUNNER_TEMP/changelog.md"

          {
            echo "### ${{ inputs.app_name }} — build $BUILD_NUM (\`$SHA\`)"
            echo
            cat "$RUNNER_TEMP/changelog.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.SPM_CACHE }}
          key: spm-${{ inputs.app_name }}-${{ hashFiles('src/**/Package.resolved') }}
          restore-keys: spm-${{ inputs.app_name }}-

      # DerivedData across runs: the run_id key never exact-hits, so every run
      # restores the newest previous cache (restore-keys) and saves its own —
      # combined with commit-time mtimes above, unchanged Swift files skip
      # recompilation entirely. If a cache ever goes weird, bump the "dd" prefix
      # to bust it.
      #
      # The flavour segment is load-bearing. Test runs build
      # Debug-iphonesimulator; archive and compile-only runs build
      # Release-iphoneos. Sharing one key made them alternate and overwrite each
      # other, so every run restored ~62MB of the other flavour's artifacts,
      # hit them for nothing, and recompiled from scratch. Measured: a test run
      # restoring a test cache compiled in 19s, one restoring an archive cache
      # took 62s for identical source.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/DerivedData
          key: dd2-${{ inputs.app_name }}-${{ inputs.xcode_version }}-${{ inputs.run_tests && 'test' || 'archive' }}-${{ github.run_id }}
          restore-keys: dd2-${{ inputs.app_name }}-${{ inputs.xcode_version }}-${{ inputs.run_tests && 'test' || 'archive' }}-

      - name: Resolve dependencies
        working-directory: src
        run: |
          xcodebuild -resolvePackageDependencies \
            ${{ steps.proj.outputs.flag }} "${{ inputs.project_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -clonedSourcePackagesDirPath "$SPM_CACHE"

      # Native tests: no simulator, no Xcode project, no app launch. Runs before
      # the heavier steps so a logic regression fails in seconds rather than after
      # an archive. Uses the toolchain already selected by "Select Xcode".
      - name: Test package (native)
        if: inputs.package_path != ''
        working-directory: src
        run: |
          set -o pipefail
          swift test --package-path "${{ inputs.package_path }}" 2>&1 \
            | tee -a "$RUNNER_TEMP/build.log"

      - name: Test
        if: inputs.run_tests
        working-directory: src
        run: |
          set -o pipefail
          # Chosen and boot-started back in "Boot simulator (background)", which
          # runs before the clone so the boot overlaps the compile.
          UDID="${SIM_UDID:-}"
          test -n "$UDID" || { echo "::error::SIM_UDID unset — did the boot step run?"; exit 1; }

          # Join the background boot. Returns immediately if it already finished;
          # otherwise waits out whatever the build did not cover.
          echo "Waiting for simulator $UDID to finish booting..."
          time xcrun simctl bootstatus "$UDID" -b
          cat "$RUNNER_TEMP/simboot.log" 2>/dev/null || true

          echo "Testing on simulator $UDID"
          xcodebuild test \
            ${{ steps.proj.outputs.flag }} "${{ inputs.project_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -clonedSourcePackagesDirPath "$SPM_CACHE" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/${{ inputs.app_name }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee -a "$RUNNER_TEMP/build.log"


      # ---------- compile-only path ----------
      - name: Build (no signing)
        if: ${{ !inputs.upload && !inputs.run_tests }}
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild build \
            ${{ steps.proj.outputs.flag }} "${{ inputs.project_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$SPM_CACHE" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee -a "$RUNNER_TEMP/build.log"

      # ---------- release path ----------
      - name: Write App Store Connect credentials
        if: inputs.upload
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # .p8 on disk for xcodebuild's automatic signing
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          # JSON form for fastlane. jq handles the newline escaping in the key body.
          jq -n \
            --arg kid "$ASC_KEY_ID" \
            --arg iss "$ASC_ISSUER_ID" \
            --arg key "$ASC_KEY_P8" \
            '{key_id:$kid, issuer_id:$iss, key:$key, duration:1200, in_house:false}' \
            > "$RUNNER_TEMP/asc_key.json"
          chmod 600 "$RUNNER_TEMP/asc_key.json"

      # agvtool is not used for this and cannot be. It looks for INFOPLIST_FILE
      # without excluding GENERATE_INFOPLIST_FILE, so on a project using the
      # generated plist it tries to open one literally named "YES" - hence
      # `Cannot find ".../YES"` in older logs - and new-marketing-version then
      # fails to update the project setting at all. It edits the on-disk
      # Info.plist instead, which the generated one overrides, so the tag was
      # stamped nowhere that mattered: v1.5.2 shipped to App Store Connect as
      # "1.5.1 - 41", the stale MARKETING_VERSION left in project.pbxproj.
      # https://github.com/fastlane/fastlane/discussions/20062
      #
      # Build settings passed on the xcodebuild command line beat the project
      # file, need no tool, and cannot half-apply. Set below on Archive.
      - name: Version to stamp
        if: inputs.upload
        id: stamp
        run: |
          ARGS="CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }}"
          if [ -n "${{ steps.ver.outputs.marketing }}" ]; then
            ARGS="$ARGS MARKETING_VERSION=${{ steps.ver.outputs.marketing }}"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "stamping: $ARGS"

      # Supply the team's distribution certificate, so automatic signing does not
      # go and mint another one.
      #
      # Automatic signing reuses a distribution identity only if the certificate
      # *and its private key* are already in a keychain it can see. A hosted
      # runner starts with neither, so xcodebuild -allowProvisioningUpdates,
      # holding an ASC key entitled to create certificates, does the obvious
      # thing: generates a keypair and issues a brand new Apple Distribution
      # certificate. Once per upload run, forever, until the team hits Apple's
      # cap and signing starts failing for everyone.
      #
      # Certificates are the scarce resource here and they belong to the *team*,
      # so one secret covers every app this workflow builds. Provisioning
      # profiles are free, unlimited and per-app, and automatic profile
      # management is what makes entitlements work at all (see Show signed
      # entitlements below) - so keep -allowProvisioningUpdates and let it
      # handle profiles only.
      #
      # A throwaway keychain, never the login keychain: created here, added to
      # the search list so xcodebuild can find it, destroyed in Scrub
      # credentials.
      - name: Install distribution certificate
        if: inputs.upload
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DEV_CERT_P12_BASE64: ${{ secrets.DEV_CERT_P12_BASE64 }}
          DIST_CERT_P12_PASSWORD: ${{ secrets.DIST_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DIST_CERT_P12_BASE64:-}" ]; then
            echo "::warning::No DIST_CERT_P12_BASE64 secret is set, so automatic signing will create a NEW Apple Distribution certificate for this run, as it has for every run before it. Apple caps how many a team may hold. Add the certificate as a secret to stop this."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Do not let it re-lock mid-build; the runner is torn down anyway.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          # Both identities, because automatic signing provisions a *development*
          # profile alongside the distribution one and will mint an Apple
          # Development certificate to satisfy it. Installing only the
          # distribution cert stopped one leak and left the other running at one
          # per build, until that type hit its own cap and every archive failed
          # with "Choose a certificate to revoke" - while the check here still
          # reported "1 valid identities found", because it only ever asked about
          # codesigning identities.
          #
          # Two blobs rather than one: `openssl pkcs12 -export` takes a single
          # key, so the certificates cannot be merged into one bundle. Same
          # password for both.
          printf '%s' "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$DIST_CERT_P12_PASSWORD" -A -t cert -f pkcs12 >/dev/null

          if [ -n "${DEV_CERT_P12_BASE64:-}" ]; then
            printf '%s' "$DEV_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dev.p12"
            security import "$RUNNER_TEMP/dev.p12" -k "$KEYCHAIN" \
              -P "$DIST_CERT_P12_PASSWORD" -A -t cert -f pkcs12 >/dev/null
            rm -f "$RUNNER_TEMP/dev.p12"
          else
            echo "::warning::No DEV_CERT_P12_BASE64 secret. Automatic signing provisions a development profile too, so it will create a new Apple Development certificate for this run - the same leak the distribution cert fixed, one type over. Apple caps these as well."
          fi
          # Without this codesign blocks on a UI authorisation prompt that no one
          # is there to answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend, keeping the existing list - dropping the system keychain
          # breaks certificate chain validation.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"

          # Every identity, not just codesigning ones. Filtering to codesigning
          # is what let a missing *development* certificate report success right
          # up until the archive failed on it.
          echo "signing identities available:"
          security find-identity -v "$KEYCHAIN"
          echo "expecting both an Apple Distribution and an Apple Development identity;"
          echo "a missing Development one means the next archive will create it and may hit Apple's cap."

          # Distribution certificates last a year, and this one signs every app
          # built by this workflow - so the day it lapses, all of them stop
          # signing at once, with an error that points at Xcode rather than
          # here. Say so with a month's notice.
          #
          # Read back from the keychain as PEM rather than parsing the .p12:
          # `openssl x509` behaves the same on the runner's LibreSSL and on an
          # OpenSSL 3 that Homebrew may have put earlier in PATH, whereas
          # reading a legacy-encrypted PKCS#12 does not. `-checkend` avoids
          # date arithmetic, which is where this would otherwise go wrong first
          # (BSD date takes different arguments from GNU date).
          security find-certificate -c "Apple Distribution" -p "$KEYCHAIN" \
            > "$RUNNER_TEMP/signing-cert.pem"
          EXPIRY=$(openssl x509 -in "$RUNNER_TEMP/signing-cert.pem" -noout -enddate | cut -d= -f2)
          echo "distribution certificate expires: $EXPIRY"

          if ! openssl x509 -in "$RUNNER_TEMP/signing-cert.pem" -noout -checkend 0 >/dev/null 2>&1; then
            echo "::error::The distribution certificate expired on $EXPIRY. Every app this workflow builds will fail to sign until it is replaced. Issue a new Apple Distribution certificate and update DIST_CERT_P12_BASE64 and DIST_CERT_P12_PASSWORD."
            exit 1
          elif ! openssl x509 -in "$RUNNER_TEMP/signing-cert.pem" -noout -checkend 2592000 >/dev/null 2>&1; then
            echo "::warning::The distribution certificate expires on $EXPIRY, within 30 days. It signs every app this workflow builds, so all of them stop on that date. Issue a replacement and update DIST_CERT_P12_BASE64 and DIST_CERT_P12_PASSWORD before then."
          fi
          rm -f "$RUNNER_TEMP/signing-cert.pem"

      # Note for anyone reviving export_by_hand: automatic signing archives for
      # development and relies on -exportArchive to re-sign for distribution, so
      # a hand-packaged IPA is refused by App Store Connect for carrying a
      # development profile. Forcing CODE_SIGN_IDENTITY does not work either —
      # xcodebuild rejects a manual identity alongside automatic style. The path
      # forward is manual signing with App Store profiles fetched for both the
      # app and the watch app, which is a bigger piece of work than it looks.
      - name: Archive
        if: inputs.upload
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild archive \
            ${{ steps.proj.outputs.flag }} "${{ inputs.project_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/${{ inputs.app_name }}.xcarchive" \
            -clonedSourcePackagesDirPath "$SPM_CACHE" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            ${{ steps.stamp.outputs.args }} \
            | tee -a "$RUNNER_TEMP/build.log"


      # Can xcodebuild's own exporter handle this archive under any Xcode here?
      #
      # This is the question underneath every hand-packaging problem. Xcode 26.0
      # reports the set of valid distribution methods as empty for an archive
      # containing a watch app, so the IPA is assembled by hand instead — and
      # Apple has now rejected that IPA with ITMS-90486 under every layout, stub
      # and altool mode it has been given.
      #
      # Worth re-asking because Apple's own reports say 26.1 exports watch apps
      # fine and 26.2 regressed. 26.1.1 was tried here and could not export
      # anything at all, which was recorded as a second, separate bug. More
      # likely it is the ordinary state of a freshly imaged runner: an Xcode
      # that has never been opened has no distribution components installed.
      # `-runFirstLaunch` installs exactly those, and was never run.
      #
      # So try every Xcode present, registering components first. This costs no
      # build number and asks Apple nothing — the exporter either produces an
      # IPA or it does not. One success deletes all of the hand packaging, and
      # with it every bundle-layout question that has been guessed at since.
      - name: Probe -exportArchive across Xcodes
        if: inputs.upload && inputs.export_probe
        run: |
          set -uo pipefail
          ORIGINAL=$(xcode-select -p)

          cat > "$RUNNER_TEMP/ProbeExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.TEAM_ID }}</string>
          </dict>
          </plist>
          PLIST

          WORKED=""
          for APPDIR in /Applications/Xcode*.app; do
            VER=$(basename "$APPDIR" .app)
            echo "==================== $VER"
            sudo xcode-select -s "$APPDIR/Contents/Developer" || continue
            xcodebuild -version || continue

            # The whole point of the probe. Silent on an image where it has
            # already run, several minutes where it has not.
            echo "--- runFirstLaunch"
            sudo xcodebuild -runFirstLaunch 2>&1 | tail -5 || true

            rm -rf "$RUNNER_TEMP/probe/$VER"
            if xcodebuild -exportArchive \
                 -archivePath "$RUNNER_TEMP/${{ inputs.app_name }}.xcarchive" \
                 -exportPath "$RUNNER_TEMP/probe/$VER" \
                 -exportOptionsPlist "$RUNNER_TEMP/ProbeExportOptions.plist" \
                 -allowProvisioningUpdates \
                 -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
                 -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
                 -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
                 2>&1 | tee "$RUNNER_TEMP/probe-$VER.log" | tail -25
            then
              echo "PROBE PASS: $VER exported"
              ls -la "$RUNNER_TEMP/probe/$VER" || true
              WORKED="$WORKED $VER"
            else
              echo "PROBE FAIL: $VER"
              grep -iE 'error|distribution method|not supported|empty' \
                "$RUNNER_TEMP/probe-$VER.log" | sort -u | head -10 || true
            fi
          done

          sudo xcode-select -s "$ORIGINAL"
          echo "==================== exporters that worked:${WORKED:- none}"
          {
            echo "### -exportArchive probe"
            echo "worked:${WORKED:- none}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the probe output
        if: inputs.upload && inputs.export_probe
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-export-probe-${{ steps.ver.outputs.build }}
          path: |
            ${{ runner.temp }}/probe/**/*.ipa
            ${{ runner.temp }}/probe-*.log
          retention-days: 5
          if-no-files-found: warn

      # Packages the IPA straight out of the archive, skipping xcodebuild's
      # exporter.
      #
      # The archive above is already signed for distribution — automatic signing,
      # the team's certificate, a profile fetched with the ASC key — so an IPA is
      # that .app inside a Payload directory, zipped. What -exportArchive adds on
      # top is a re-sign and a pass through IDEDistribution.
      #
      # IDEDistribution is exactly what cannot handle an archive containing a
      # watch app under Xcode 26: it reports the set of valid distribution
      # methods as empty and then rejects app-store-connect against nothing, on
      # 26.0 and 26.1.1 alike. Not the 26.2 automatic-signing regression Apple
      # has acknowledged — this reproduces on versions older than that one.
      #
      # The cost is real and worth stating: no re-signing and no validation, so
      # whatever the archive is signed with is what ships, and a malformed bundle
      # is App Store Connect's problem rather than xcodebuild's. Off by default;
      # only an app that cannot export any other way should take that trade.
      # Fetches an App Store profile per bundle identifier, creating it if the
      # team does not have one yet. The App IDs themselves must already exist —
      # -allowProvisioningUpdates and this both mint profiles freely and neither
      # can invent an App ID.
      - name: Fetch App Store provisioning profiles
        if: inputs.upload && inputs.export_by_hand && inputs.resign_bundle_ids != ''
        env:
          RESIGN_BUNDLE_IDS: ${{ inputs.resign_bundle_ids }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/profiles"
          for BID in $RESIGN_BUNDLE_IDS; do
            echo "--- App Store profile for $BID"
            fastlane sigh \
              --api_key_path "$RUNNER_TEMP/asc_key.json" \
              --app_identifier "$BID" \
              --team_id "$TEAM_ID" \
              --output_path "$RUNNER_TEMP/profiles" \
              --filename "$BID.mobileprovision"
          done
          ls -la "$RUNNER_TEMP/profiles"

      - name: Package IPA from the archive
        if: inputs.upload && inputs.export_by_hand
        env:
          RESIGN_BUNDLE_IDS: ${{ inputs.resign_bundle_ids }}
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/${{ inputs.app_name }}.xcarchive"
          APP="$ARCHIVE/Products/Applications/${{ inputs.app_name }}.app"
          test -d "$APP" || { echo "no ${{ inputs.app_name }}.app in $ARCHIVE"; ls -R "$ARCHIVE/Products" || true; exit 1; }

          rm -rf "$RUNNER_TEMP/export"
          mkdir -p "$RUNNER_TEMP/export/Payload"
          # -R follows the bundle; symlinks inside frameworks are preserved by
          # zip -y below.
          # How Xcode sealed this same bundle, before anything here touches it.
          #
          # The comparison is the point. App Store Connect rejected 0.3.30 with
          # ITMS-90486 "the expected app is missing from .../Watch" while the IPA
          # plainly had it there — because the re-signing below sealed the watch
          # app as loose files rather than as nested code, with no cdhash. Whether
          # Xcode's own signature records it as nested says whether that is a
          # fault in how this re-signs, or simply not how nesting works.
          # plutil rather than a heredoc: the script would have to sit at this
          # block's indentation to keep the YAML valid, and Python will not take
          # uniformly indented source.
          seal_summary() {
            WHOSE="$1"
            CR="$2/_CodeSignature/CodeResources"
            if [ ! -f "$CR" ]; then echo "  $WHOSE: no CodeResources"; return; fi
            NESTED=$(plutil -p "$CR" | grep -c '"nested"' || true)
            SEALED=$(plutil -p "$CR" | grep -c '"cdhash"' || true)
            echo "  $WHOSE: $NESTED nested rule(s), $SEALED bundle(s) sealed by cdhash"
          }
          echo "--- code seal, before and after re-signing ---"
          seal_summary "xcode (archive)" "$APP"

          cp -R "$APP" "$RUNNER_TEMP/export/Payload/"
          PAYLOAD_APP="$RUNNER_TEMP/export/Payload/${{ inputs.app_name }}.app"

          # A watch app has to sit in Watch/, and Xcode 26 builds it into
          # PlugIns/ instead. App Store Connect is explicit about it:
          #
          #   Invalid directory. The bundle …/PlugIns/NurtureNavWatch.app is not
          #   contained in a correctly named directory. It should be under Watch.
          #
          # Moving the embed build phase back to Watch/ fails the *build* with a
          # bare exit 70, so the two ends disagree and only one of them can be
          # argued with. Since this path packages the IPA itself, it can simply
          # put the bundle where the store wants it — and because the move
          # happens before re-signing below, the signatures cover the layout that
          # actually ships.
          #
          # A `.app` inside PlugIns is always wrong for the store, whatever app is
          # being built, so this needs no per-app switch. Extensions are `.appex`
          # and stay exactly where they are.
          if [ "${{ inputs.keep_watch_in_plugins }}" = "true" ]; then
            echo "leaving any watch app in PlugIns/, as Xcode 26 built it"
          elif [ -d "$PAYLOAD_APP/PlugIns" ]; then
            for WATCHAPP in "$PAYLOAD_APP/PlugIns"/*.app; do
              [ -d "$WATCHAPP" ] || continue
              mkdir -p "$PAYLOAD_APP/Watch"
              mv "$WATCHAPP" "$PAYLOAD_APP/Watch/"
              echo "moved $(basename "$WATCHAPP") from PlugIns/ to Watch/"
            done
            rmdir "$PAYLOAD_APP/PlugIns" 2>/dev/null && echo "removed empty PlugIns/" || true
          fi

          # Re-sign for distribution, on the copy rather than the archive, so the
          # archive stays exactly what xcodebuild produced and remains uploadable
          # by the ordinary export path if this one is ever turned off.
          if [ -n "${RESIGN_BUNDLE_IDS:-}" ]; then
            IDENTITY="Apple Distribution"
            security find-identity -v -p codesigning | sed 's/^/  /'

            sign_one() {
              BUNDLE="$1"
              BID=""
              if [ -f "$BUNDLE/Info.plist" ]; then
                BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$BUNDLE/Info.plist" 2>/dev/null || true)
              fi
              PROFILE="$RUNNER_TEMP/profiles/$BID.mobileprovision"
              if [ -n "$BID" ] && [ -f "$PROFILE" ]; then
                cp "$PROFILE" "$BUNDLE/embedded.mobileprovision"
                # Entitlements are granted by the profile, so they have to come
                # out of the profile that is about to be embedded rather than
                # from whatever the development signing baked in.
                security cms -D -i "$PROFILE" > "$RUNNER_TEMP/prof.plist"
                /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' \
                  "$RUNNER_TEMP/prof.plist" > "$RUNNER_TEMP/ent.plist"
                echo "  signing $BID  <- $(basename "$PROFILE")"
                codesign --force --sign "$IDENTITY" \
                  --entitlements "$RUNNER_TEMP/ent.plist" \
                  --generate-entitlement-der "$BUNDLE"
              else
                # Frameworks and dylibs carry no profile of their own and must
                # still be re-signed, or the outer signature covers a bundle
                # signed by a different identity and the whole thing is invalid.
                echo "  signing $(basename "$BUNDLE")  (no profile)"
                codesign --force --sign "$IDENTITY" "$BUNDLE"
              fi
            }

            # Deepest first: signing an outer bundle seals whatever is inside it,
            # so anything re-signed afterwards invalidates the seal above it.
            find "$PAYLOAD_APP" \
                 \( -name '*.app' -o -name '*.appex' -o -name '*.framework' -o -name '*.dylib' \) \
                 -not -path "$PAYLOAD_APP" \
              | awk -F/ '{ print NF, $0 }' | sort -rn | cut -d' ' -f2- \
              | while IFS= read -r NESTED; do sign_one "$NESTED"; done
            sign_one "$PAYLOAD_APP"

            echo "--- what the app is now signed with"
            codesign -dvvv "$PAYLOAD_APP" 2>&1 | grep -E 'Authority|TeamIdentifier|Identifier=' | sed 's/^/  /'
            seal_summary "ours (re-signed)" "$PAYLOAD_APP"
          fi

          ( cd "$RUNNER_TEMP/export" && zip -qry "${{ inputs.app_name }}.ipa" Payload )
          # An app containing a watch app also needs a WatchKit stub beside
          # Payload, which -exportArchive injects from the SDK and a plain zip of
          # the archive would leave out. App Store Connect rejects the upload
          # without it (ITMS-90398, "Invalid WatchKit support").
          if find "$APP" -maxdepth 3 -name '*.app' -not -path "$APP" | grep -q .; then
            WK="$(xcode-select -p)/Platforms/WatchOS.platform/Developer/SDKs/WatchOS.sdk/Library/Application Support/WatchKit/WK"
            if [ -f "$WK" ]; then
              mkdir -p "$RUNNER_TEMP/export/WatchKitSupport2"
              cp "$WK" "$RUNNER_TEMP/export/WatchKitSupport2/WK"
              STUB="$RUNNER_TEMP/export/WatchKitSupport2/WK"

              # The SDK's copy of the stub carries an arm64e slice, and App Store
              # Connect refuses a submission containing one:
              #
              #   ITMS-90398: Invalid WatchKit support — The bundle contains
              #   architectures that aren't allowed …
              #
              # -exportArchive strips it on the way out, silently, so this is one
              # more thing the exporter was doing for us that hand-packaging has
              # to do for itself. Costs nothing when the slice is absent.
              echo "WK stub as shipped by the SDK: $(lipo -info "$STUB" 2>/dev/null || file -b "$STUB")"
              if lipo -info "$STUB" 2>/dev/null | grep -q arm64e; then
                lipo -remove arm64e "$STUB" -output "$STUB.thin" && mv "$STUB.thin" "$STUB"
                echo "removed arm64e: $(lipo -info "$STUB")"
              fi

              ( cd "$RUNNER_TEMP/export" && zip -qry "${{ inputs.app_name }}.ipa" WatchKitSupport2 )
              rm -rf "$RUNNER_TEMP/export/WatchKitSupport2"
              echo "added WatchKitSupport2/WK"
            else
              echo "::warning::watch content present but no WatchKit stub at $WK"
            fi
          fi

          # Exactly what App Store Connect is about to receive.
          #
          # Worth the few lines: three uploads in a row were diagnosed by reading
          # Apple's rejection and reasoning backwards about what the IPA probably
          # looked like, when the answer was one `unzip -l` away. ITMS rejections
          # name a path — being able to compare that path against the real archive
          # turns a guess into a check.
          IPA_LIST="$RUNNER_TEMP/ipa-listing.txt"
          unzip -l "$RUNNER_TEMP/export/${{ inputs.app_name }}.ipa" | awk '{ print $NF }' > "$IPA_LIST"
          echo "--- IPA: every entry mentioning Watch ---"
          grep -i watch "$IPA_LIST" | head -25 || echo "  NONE — the watch app is not in the archive"
          echo "--- IPA: top level inside the app bundle ---"
          grep -E "^Payload/[^/]+\.app/[^/]+/?$" "$IPA_LIST" | sort -u | head -30
          echo "--- IPA: $(grep -c . "$IPA_LIST") entries total ---"
          WATCH_BUNDLE=$(find "$RUNNER_TEMP/export/Payload" -maxdepth 3 -name '*.app' \
            -not -path "$PAYLOAD_APP" | head -1)
          if [ -n "$WATCH_BUNDLE" ]; then
            echo "--- watch bundle: $WATCH_BUNDLE"
            plutil -p "$WATCH_BUNDLE/Info.plist" 2>/dev/null \
              | grep -Ei 'WKApplication|WKWatchKitApp|WKCompanion|CFBundleIdentifier|CFBundleExecutable|CFBundleIconName|CFBundleVersion|CFBundleShortVersion|UIDeviceFamily|DTPlatformName|MinimumOSVersion' \
              || echo "  (could not read Info.plist)"
          else
            echo "--- no nested .app found in the payload"
          fi

          rm -rf "$RUNNER_TEMP/export/Payload"

          echo "packaged:"
          ls -la "$RUNNER_TEMP/export"
          echo "watch content, if any:"
          find "$APP" -maxdepth 3 -name '*.app' -not -path "$APP" || true

      - name: Export IPA
        if: inputs.upload && !inputs.export_by_hand
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.TEAM_ID }}</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/${{ inputs.app_name }}.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      # What the IPA is actually signed with. Entitlements are applied at
      # signing time, so archiving unsigned - as this did until now - produced
      # an app that requested none, and -exportArchive happily re-signed it that
      # way. Tembed's hotspot join failed with NEHotspotConfigurationError 8 for
      # exactly that reason, and nothing in CI said a word. Cheap to print.
      - name: Show signed entitlements
        if: inputs.upload
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)
          rm -rf "$RUNNER_TEMP/unz" && mkdir -p "$RUNNER_TEMP/unz"
          unzip -q -o "$IPA" -d "$RUNNER_TEMP/unz"
          APP=$(find "$RUNNER_TEMP/unz/Payload" -maxdepth 1 -name '*.app' | head -1)
          codesign -d --entitlements :- "$APP" 2>/dev/null || true

      # Upload only — don't hold the job hostage to Apple's processing queue.
      # Waiting for processing, writing "What to Test", and assigning groups
      # happen in the best-effort step below; an ASC hiccup there is a warning,
      # not a red run.
      # altool, directly, for the hand-packaged path.
      #
      # fastlane accepts app_platform and does not pass it through, so altool
      # still refuses an IPA it cannot classify — and an IPA packaged by hand
      # carries none of the metadata it would classify it by. altool takes -t
      # itself, so this says it there.
      #
      # The .p8 is already on disk from "Write App Store Connect credentials";
      # altool finds it by key id.
      - name: Upload to TestFlight (altool)
        if: inputs.upload && inputs.export_by_hand && !inputs.package_only
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "::error::no .ipa produced"; exit 1; }
          echo "$IPA" > "$RUNNER_TEMP/ipa_path"

          # Identifiers for --upload-package, read from the app that is
          # actually in the archive rather than assumed. See the upload below for
          # why both altool modes are tried.
          APP="$RUNNER_TEMP/${{ inputs.app_name }}.xcarchive/Products/Applications/${{ inputs.app_name }}.app"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist")
          BUNDLE_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist")
          SHORT_VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist")
          echo "uploading $BUNDLE_ID $SHORT_VERSION ($BUNDLE_VERSION) as app ${{ inputs.asc_app_id }}"

          test -n "${{ inputs.asc_app_id }}" || {
            echo "::error::export_by_hand needs asc_app_id"; exit 1; }

          # altool's exit code cannot be trusted here: it has printed an error
          # and exited 0. The output is checked as well as the status.
          set -o pipefail

          # --upload-app first, --upload-package as the fallback.
          #
          # The difference is what reaches App Store Connect *besides* the bytes.
          # --upload-app reads the package and describes what it finds, including
          # a watch app. --upload-package infers nothing and is told only the
          # iOS-level identifiers, so nothing in that delivery mentions a watch
          # app at all — a candidate for the asynchronous "the expected app is
          # missing from .../Watch" that follows an otherwise accepted upload.
          #
          # --upload-app was abandoned earlier for "Cannot determine the
          # platform", but that was against a package that was also
          # development-signed and carried an arm64e stub. Worth asking again now
          # the package is well formed; if it still cannot classify it, the
          # fallback runs and nothing is lost but a minute.
          UPLOADED=""
          echo "--- trying --upload-app (derives the delivery from the package)"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "${{ secrets.ASC_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" 2>&1 | tee "$RUNNER_TEMP/altool.log" || true
          if ! grep -q 'ERROR' "$RUNNER_TEMP/altool.log"; then
            UPLOADED="--upload-app"
          else
            echo "--- --upload-app did not take it; falling back to --upload-package"
            xcrun altool --upload-package "$IPA" \
              --type ios \
              --apple-id "${{ inputs.asc_app_id }}" \
              --bundle-id "$BUNDLE_ID" \
              --bundle-version "$BUNDLE_VERSION" \
              --bundle-short-version-string "$SHORT_VERSION" \
              --apiKey "${{ secrets.ASC_KEY_ID }}" \
              --apiIssuer "${{ secrets.ASC_ISSUER_ID }}" 2>&1 | tee "$RUNNER_TEMP/altool.log"
            grep -q 'ERROR' "$RUNNER_TEMP/altool.log" || UPLOADED="--upload-package"
          fi

          if [ -z "$UPLOADED" ]; then
            echo "::error::altool reported an error — see above"
            exit 1
          fi
          echo "uploaded via $UPLOADED"

      - name: Upload to TestFlight
        if: inputs.upload && !inputs.export_by_hand && !inputs.package_only
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          SPACESHIP_SKIP_2FA_UPGRADE: "1"
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "::error::no .ipa produced"; exit 1; }
          echo "$IPA" > "$RUNNER_TEMP/ipa_path"

          # app_platform is stated rather than inferred. altool reads it out of
          # metadata that -exportArchive leaves behind, so an IPA packaged by
          # hand fails with "Cannot determine the platform; please specify
          # --platform." Harmless on the exported path, which reaches the same
          # answer on its own.
          fastlane run upload_to_testflight \
            ipa:"$IPA" \
            app_platform:"ios" \
            api_key_path:"$RUNNER_TEMP/asc_key.json" \
            skip_waiting_for_build_processing:true

      # Distribution is a separate step from the changelog, and it is the one
      # that matters.
      #
      # `Upload to TestFlight` above passes skip_waiting_for_build_processing,
      # so it only uploads - it does not hand the build to anybody. Assigning it
      # to testers happens here, and until it does the build sits in App Store
      # Connect fully processed and visible to nobody, which looks exactly like
      # a release that never happened.
      #
      # These two jobs used to share one step, and one timeout killed both. A
      # slow processing queue then cost the build itself rather than just its
      # release notes, silently, because the step was marked continue-on-error
      # on the assumption that release notes were all it did.
      #
      # Retried, because the only reason it fails in practice is App Store
      # Connect still processing - and the fix for that is to ask again. Three
      # attempts of ten minutes bounds it at half an hour rather than the six
      # hour runner limit an unbounded wait allowed.
      - name: Distribute to testers
        if: inputs.upload && !inputs.package_only
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          SPACESHIP_SKIP_2FA_UPGRADE: "1"
        run: |
          IPA=$(cat "$RUNNER_TEMP/ipa_path")
          GROUPS="${{ inputs.testflight_groups }}"

          # NOTE: never pass boolean:false args to `fastlane run` — CLI values
          # arrive as strings and Ruby treats "false" as truthy. That is exactly
          # how distribute_external:false kept triggering external beta review
          # (and its Beta App Description requirement) on every release.
          # A build App Store Connect *rejects* never finishes processing, so this
          # wait is the difference between a run that reports and a run that sits
          # there. altool succeeding only means Apple accepted the upload;
          # validation happens afterwards and is announced by email, not to CI.
          #
          # Five minutes is well past a normal processing time and short enough
          # that a rejection is obvious while you are still watching. The message
          # below matters as much as the number — a bare timeout here reads like a
          # flake, and it usually is not.
          ARGS=(
            ipa:"$IPA"
            api_key_path:"$RUNNER_TEMP/asc_key.json"
            distribute_only:true
            build_number:"${{ steps.ver.outputs.build }}"
            wait_processing_timeout_duration:240
          )

          if [ -n "$GROUPS" ]; then
            ARGS+=( distribute_external:true groups:"$GROUPS" )
          fi

          # Beta App Description is an app-level field in App Store Connect's
          # Test Information, and Apple requires it before a build reaches
          # *external* testers. Passing it lets fastlane create the
          # betaAppLocalization rather than needing someone to fill the field in
          # by hand once per app.
          if [ -n "${{ inputs.beta_app_description }}" ]; then
            ARGS+=( beta_app_description:"${{ inputs.beta_app_description }}" )
          fi
          if [ -n "${{ inputs.beta_app_feedback_email }}" ]; then
            ARGS+=( beta_app_feedback_email:"${{ inputs.beta_app_feedback_email }}" )
          fi

          # Judged on the log, not the exit code. submit_beta_review defaults to
          # true, so fastlane tries to submit for *external* beta review after
          # distributing, and App Store Connect has rejected that without a Beta
          # App Description since Nov 2024 (fastlane/fastlane#28630, still open)
          # even when fastlane set the description moments earlier. That
          # rejection is noise here - internal testers get builds without it -
          # and it must not be allowed to mask a distribution that worked.
          # Two attempts, not three. Each one waits out the full processing
          # timeout, so against a build App Store Connect has rejected — which
          # never finishes processing — every extra attempt is another four
          # minutes of a run that cannot succeed. One retry still covers the
          # genuine flake this loop was written for.
          distributed=
          for attempt in 1 2; do
            echo "distribution attempt $attempt of 2"
            set +e
            fastlane run upload_to_testflight "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/distribute.log"
            set -e
            if grep -q "Distributing new build to testers" "$RUNNER_TEMP/distribute.log"; then
              distributed=yes
              break
            fi
            echo "not distributed yet; App Store Connect is most likely still processing"
          done

          if [ -z "$distributed" ]; then
            echo "::error::The build uploaded but was never distributed, so it will not appear in TestFlight for anyone. Either App Store Connect is still processing, or it REJECTED the build - a rejected build never finishes processing, and Apple reports that by email rather than to CI, so check the mailbox for an ITMS- code before assuming this was slowness. If processing simply ran long, the binary is fine: add it to the tester group by hand or re-run this job."
            exit 1
          fi
          echo "distributed"

      # Genuinely optional, unlike the step this was split out of. By the time
      # it runs the build has already been distributed, so processing is
      # complete and this returns quickly rather than waiting on anything.
      - name: Set What to Test (best effort)
        if: inputs.upload && !inputs.package_only
        continue-on-error: true
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          SPACESHIP_SKIP_2FA_UPGRADE: "1"
        run: |
          IPA=$(cat "$RUNNER_TEMP/ipa_path")
          CHANGELOG=$(cat "$RUNNER_TEMP/changelog.md")

          # Prove what is being sent. "What to Test" showing nothing has two
          # completely different causes - an empty changelog, or a changelog
          # that was set before a later step failed - and the log could not
          # tell them apart.
          echo "changelog: $(printf '%s' "$CHANGELOG" | wc -c) bytes"
          printf '%s\n' "$CHANGELOG" | head -5

          set +e
          fastlane run upload_to_testflight \
            ipa:"$IPA" \
            api_key_path:"$RUNNER_TEMP/asc_key.json" \
            distribute_only:true \
            build_number:"${{ steps.ver.outputs.build }}" \
            changelog:"$CHANGELOG" \
            wait_processing_timeout_duration:300 2>&1 | tee "$RUNNER_TEMP/pilot.log"
          set -e

          if grep -q "Successfully set the changelog" "$RUNNER_TEMP/pilot.log"; then
            echo "changelog set; ignoring any beta-review submission failure after it"
          else
            echo "::warning::The build is distributed and installable, but the changelog was not set, so What to Test will be empty."
          fi

      - name: Summarize release
        if: inputs.upload && success() && !inputs.package_only
        run: |
          {
            echo
            echo "✅ **Shipped to TestFlight** — build \`${{ steps.ver.outputs.build }}\`"
            if [ -n "${{ steps.ver.outputs.marketing }}" ]; then
              echo "Version \`${{ steps.ver.outputs.marketing }}\`"
            fi
            if [ -n "${{ inputs.testflight_groups }}" ]; then
              echo "Distributed to: ${{ inputs.testflight_groups }}"
            else
              echo "Internal testers only"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- diagnostics ----------
      # Compiler/test errors become check-run annotations, which are readable
      # through the public API — so failures can be diagnosed without log access.
      - name: Keep the IPA
        if: inputs.upload && inputs.package_only
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-ipa-${{ steps.ver.outputs.build }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 5
          if-no-files-found: error

      - name: Surface build errors
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            grep -E "error: |Testing failed|\*\* TEST FAILED| failed \(" "$RUNNER_TEMP/build.log" \
              | sort -u | head -10 \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-${{ steps.ver.outputs.build || 'unknown' }}
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/changelog.md
            ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Scrub credentials
        if: always()
        run: |
          rm -rf ~/.appstoreconnect "$RUNNER_TEMP/asc_key.json" src
          # Take the signing keychain out of the search list before deleting it,
          # so a reused runner is not left pointing at a keychain that is gone.
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security list-keychains -d user -s \
              $(security list-keychains -d user | tr -d '"' | grep -v signing.keychain || true)
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          fi
          rm -f "$RUNNER_TEMP/dist.p12"
