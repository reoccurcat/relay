name: ios-build

on:
  workflow_call:
    inputs:
      app_name:
        description: "Short name for archive/artifact naming, e.g. Studio"
        required: true
        type: string
      gitlab_path:
        description: "namespace/project on the GitLab host"
        required: true
        type: string
      project_path:
        description: ".xcodeproj or .xcworkspace path, relative to repo root"
        required: true
        type: string
      scheme:
        required: true
        type: string
      ref:
        description: "GitLab ref to build (branch or tag)"
        required: false
        type: string
        default: "main"
      gitlab_host:
        required: false
        type: string
        default: "gitlab.nurture-labs.io"
      xcode_version:
        required: false
        type: string
        default: "26.0"
      runner:
        required: false
        type: string
        default: "macos-15"
      configuration:
        required: false
        type: string
        default: "Release"
      upload:
        description: "true = archive + sign + TestFlight. false = compile only."
        required: false
        type: boolean
        default: false
      run_tests:
        required: false
        type: boolean
        default: true
      test_destination:
        required: false
        type: string
        default: "platform=iOS Simulator,name=iPhone 16,OS=latest"
      testflight_groups:
        description: "Comma-separated external tester groups. Empty = internal testers only."
        required: false
        type: string
        default: ""

    secrets:
      GITLAB_TOKEN:
        required: true
      ASC_KEY_P8:
        required: false
      ASC_KEY_ID:
        required: false
      ASC_ISSUER_ID:
        required: false
      TEAM_ID:
        required: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90

    env:
      SPM_CACHE: ${{ github.workspace }}/.spm

    steps:
      - name: Select Xcode
        run: |
          ls /Applications | grep -i '^Xcode'
          sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode_version }}.app/Contents/Developer"
          xcodebuild -version

      # NOTE: full history on purpose — `git rev-list --count` needs it.
      # --depth 1 would make every build number 1.
      - name: Clone source from GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --branch "${{ inputs.ref }}" \
            "https://oauth2:${GITLAB_TOKEN}@${{ inputs.gitlab_host }}/${{ inputs.gitlab_path }}.git" src
          cd src && git log -1 --oneline

          # Deterministic mtimes (last-commit time per file): a fresh clone
          # stamps "now" on everything, which makes Xcode's incremental build
          # database treat every file as changed and defeats the DerivedData
          # cache. With commit-time mtimes, unchanged files keep identical
          # stats across runs and skip recompilation.
          python3 - <<'PY'
          import subprocess, os
          # Newest-first walk of the log; the first commit that names a file
          # is that file's last change. Format record and file list are read
          # as separate lines, which sidesteps -z quirks entirely.
          stamped = {}
          current = None
          log = subprocess.check_output(
              ["git", "log", "--format=commit:%ct", "--name-only"]
          ).decode("utf-8", "replace")
          for line in log.splitlines():
              if line.startswith("commit:"):
                  current = int(line[7:])
              elif line and current is not None and line not in stamped:
                  stamped[line] = current
          restored = 0
          for path, ts in stamped.items():
              try:
                  os.utime(path, (ts, ts))
                  restored += 1
              except OSError:
                  pass
          print(f"restored mtimes for {restored} files")
          PY

      - name: Resolve project flags
        id: proj
        working-directory: src
        run: |
          P="${{ inputs.project_path }}"
          test -e "$P" || { echo "::error::$P not found in repo"; exit 1; }
          case "$P" in
            *.xcworkspace) echo "flag=-workspace" >> "$GITHUB_OUTPUT" ;;
            *.xcodeproj)   echo "flag=-project"   >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::project_path must end in .xcodeproj or .xcworkspace"; exit 1 ;;
          esac
          echo "dir=$(dirname "$P")" >> "$GITHUB_OUTPUT"

      - name: Compute version and changelog
        id: ver
        working-directory: src
        run: |
          # Monotonic and reproducible: the same commit always yields the same build number.
          BUILD_NUM=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          echo "build=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          # Marketing version comes from the tag when building one; otherwise leave the project alone.
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            TAG=$(git describe --exact-match --tags HEAD)
            echo "marketing=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "marketing=" >> "$GITHUB_OUTPUT"
          fi

          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            echo "Changes since $PREV:" > "$RUNNER_TEMP/changelog.md"
            git log --no-merges --pretty='- %s' "$PREV"..HEAD >> "$RUNNER_TEMP/changelog.md"
          else
            echo "Recent changes:" > "$RUNNER_TEMP/changelog.md"
            git log --no-merges --pretty='- %s' -20 >> "$RUNNER_TEMP/changelog.md"
          fi

          # TestFlight caps "What to Test" at 4000 characters.
          head -c 3900 "$RUNNER_TEMP/changelog.md" > "$RUNNER_TEMP/changelog.trunc.md"
          mv "$RUNNER_TEMP/changelog.trunc.md" "$RUNNER_TEMP/changelog.md"

          {
            echo "### ${{ inputs.app_name }} — build $BUILD_NUM (\`$SHA\`)"
            echo
            cat "$RUNNER_TEMP/changelog.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.SPM_CACHE }}
          key: spm-${{ inputs.app_name }}-${{ hashFiles('src/**/Package.resolved') }}
          restore-keys: spm-${{ inputs.app_name }}-

      # DerivedData across runs: the run_id key never exact-hits, so every run
      # restores the newest previous cache (restore-keys) and saves its own —
      # combined with commit-time mtimes above, unchanged Swift files skip
      # recompilation entirely. If a cache ever goes weird, bump the "dd1"
      # prefix to bust it.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/DerivedData
          key: dd1-${{ inputs.app_name }}-${{ inputs.xcode_version }}-${{ github.run_id }}
          restore-keys: dd1-${{ inputs.app_name }}-${{ inputs.xcode_version }}-

      - name: Resolve dependencies
        working-directory: src
        run: |
          xcodebuild -resolvePackageDependencies \
            ${{ steps.proj.outputs.flag }} "${{ inputs.project_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -clonedSourcePackagesDirPath "$SPM_CACHE"

      - name: Test
        if: inputs.run_tests
        working-directory: src
        run: |
          set -o pipefail
          # Pick the newest-runtime iPhone simulator actually present on this
          # image — device names churn with every Xcode release.
          UDID=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
             | select(.key | contains("iOS"))
            ] | sort_by(.key) | reverse
              | .[].value[] | select(.name | startswith("iPhone")) | .udid' | head -n 1)
          test -n "$UDID" || { echo "::error::no iPhone simulator on this image"; xcrun simctl list devices available; exit 1; }
          echo "Testing on simulator $UDID"
          xcodebuild test \
            ${{ steps.proj.outputs.flag }} "${{ inputs.project_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -clonedSourcePackagesDirPath "$SPM_CACHE" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/${{ inputs.app_name }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee -a "$RUNNER_TEMP/build.log"


      # ---------- compile-only path ----------
      - name: Build (no signing)
        if: ${{ !inputs.upload && !inputs.run_tests }}
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild build \
            ${{ steps.proj.outputs.flag }} "${{ inputs.project_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$SPM_CACHE" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee -a "$RUNNER_TEMP/build.log"

      # ---------- release path ----------
      - name: Write App Store Connect credentials
        if: inputs.upload
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # .p8 on disk for xcodebuild's automatic signing
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          # JSON form for fastlane. jq handles the newline escaping in the key body.
          jq -n \
            --arg kid "$ASC_KEY_ID" \
            --arg iss "$ASC_ISSUER_ID" \
            --arg key "$ASC_KEY_P8" \
            '{key_id:$kid, issuer_id:$iss, key:$key, duration:1200, in_house:false}' \
            > "$RUNNER_TEMP/asc_key.json"
          chmod 600 "$RUNNER_TEMP/asc_key.json"

      - name: Stamp version
        if: inputs.upload
        working-directory: src/${{ steps.proj.outputs.dir }}
        run: |
          agvtool new-version -all "${{ steps.ver.outputs.build }}"
          if [ -n "${{ steps.ver.outputs.marketing }}" ]; then
            agvtool new-marketing-version "${{ steps.ver.outputs.marketing }}"
          fi

      - name: Archive
        if: inputs.upload
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild archive \
            ${{ steps.proj.outputs.flag }} "${{ inputs.project_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/${{ inputs.app_name }}.xcarchive" \
            -clonedSourcePackagesDirPath "$SPM_CACHE" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            | tee -a "$RUNNER_TEMP/build.log"


      - name: Export IPA
        if: inputs.upload
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.TEAM_ID }}</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/${{ inputs.app_name }}.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      # Upload only — don't hold the job hostage to Apple's processing queue.
      # Waiting for processing, writing "What to Test", and assigning groups
      # happen in the best-effort step below; an ASC hiccup there is a warning,
      # not a red run.
      - name: Upload to TestFlight
        if: inputs.upload
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          SPACESHIP_SKIP_2FA_UPGRADE: "1"
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "::error::no .ipa produced"; exit 1; }
          echo "$IPA" > "$RUNNER_TEMP/ipa_path"

          fastlane run upload_to_testflight \
            ipa:"$IPA" \
            api_key_path:"$RUNNER_TEMP/asc_key.json" \
            skip_waiting_for_build_processing:true

      - name: Publish changelog and groups (best effort)
        if: inputs.upload
        continue-on-error: true
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          SPACESHIP_SKIP_2FA_UPGRADE: "1"
        run: |
          IPA=$(cat "$RUNNER_TEMP/ipa_path")
          CHANGELOG=$(cat "$RUNNER_TEMP/changelog.md")
          GROUPS="${{ inputs.testflight_groups }}"

          # NOTE: never pass boolean:false args to `fastlane run` — CLI values
          # arrive as strings and Ruby treats "false" as truthy. That is exactly
          # how distribute_external:false kept triggering external beta review
          # (and its Beta App Description requirement) on every release.
          ARGS=(
            ipa:"$IPA"
            api_key_path:"$RUNNER_TEMP/asc_key.json"
            distribute_only:true
            build_number:"${{ steps.ver.outputs.build }}"
            changelog:"$CHANGELOG"
          )

          if [ -n "$GROUPS" ]; then
            ARGS+=( distribute_external:true groups:"$GROUPS" )
          fi

          if ! fastlane run upload_to_testflight "${ARGS[@]}"; then
            echo "::warning::Build uploaded fine, but setting the changelog/groups failed — fill Test Information in App Store Connect or check Apple system status."
          fi

      - name: Summarize release
        if: inputs.upload && success()
        run: |
          {
            echo
            echo "✅ **Shipped to TestFlight** — build \`${{ steps.ver.outputs.build }}\`"
            if [ -n "${{ steps.ver.outputs.marketing }}" ]; then
              echo "Version \`${{ steps.ver.outputs.marketing }}\`"
            fi
            if [ -n "${{ inputs.testflight_groups }}" ]; then
              echo "Distributed to: ${{ inputs.testflight_groups }}"
            else
              echo "Internal testers only"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- diagnostics ----------
      # Compiler/test errors become check-run annotations, which are readable
      # through the public API — so failures can be diagnosed without log access.
      - name: Surface build errors
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            grep -E "error: |Testing failed|\*\* TEST FAILED| failed \(" "$RUNNER_TEMP/build.log" \
              | sort -u | head -10 \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-${{ steps.ver.outputs.build || 'unknown' }}
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/changelog.md
            ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Scrub credentials
        if: always()
        run: rm -rf ~/.appstoreconnect "$RUNNER_TEMP/asc_key.json" src
