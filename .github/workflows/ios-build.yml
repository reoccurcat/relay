name: ios-build

on:
  workflow_call:
    inputs:
      app_name:
        description: "Short name for archive/artifact naming, e.g. Studio"
        required: true
        type: string
      gitlab_path:
        description: "namespace/project on the GitLab host"
        required: true
        type: string
      project_path:
        description: ".xcodeproj or .xcworkspace path, relative to repo root"
        required: true
        type: string
      scheme:
        required: true
        type: string
      ref:
        description: "GitLab ref to build (branch or tag)"
        required: false
        type: string
        default: "main"
      gitlab_host:
        required: false
        type: string
        default: "gitlab.nurture-labs.io"
      xcode_version:
        required: false
        type: string
        default: "26.0"
      runner:
        required: false
        type: string
        default: "macos-15"
      configuration:
        required: false
        type: string
        default: "Release"
      upload:
        description: "true = archive + sign + TestFlight. false = compile only."
        required: false
        type: boolean
        default: false
      run_tests:
        required: false
        type: boolean
        default: true
      test_destination:
        required: false
        type: string
        default: "platform=iOS Simulator,name=iPhone 16,OS=latest"
      testflight_groups:
        description: "Comma-separated external tester groups. Empty = internal testers only."
        required: false
        type: string
        default: ""
      beta_app_description:
        description: >-
          App-level Test Information text. App Store Connect requires this
          before any build reaches external testers, and without it the
          metadata step fails after the changelog has already been set.
          Set once per app; fastlane creates the betaAppLocalization.
        required: false
        type: string
        default: ""
      beta_app_feedback_email:
        description: "Where TestFlight feedback goes. Set alongside beta_app_description."
        required: false
        type: string
        default: ""

    secrets:
      GITLAB_TOKEN:
        required: true
      ASC_KEY_P8:
        required: false
      ASC_KEY_ID:
        required: false
      ASC_ISSUER_ID:
        required: false
      TEAM_ID:
        required: false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90

    env:
      SPM_CACHE: ${{ github.workspace }}/.spm

    steps:
      - name: Select Xcode
        run: |
          ls /Applications | grep -i '^Xcode'
          sudo xcode-select -s "/Applications/Xcode_${{ inputs.xcode_version }}.app/Contents/Developer"
          xcodebuild -version

      # NOTE: full history on purpose — `git rev-list --count` needs it.
      # --depth 1 would make every build number 1.
      - name: Clone source from GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          git clone --branch "${{ inputs.ref }}" \
            "https://oauth2:${GITLAB_TOKEN}@${{ inputs.gitlab_host }}/${{ inputs.gitlab_path }}.git" src
          cd src && git log -1 --oneline

          # Deterministic mtimes (last-commit time per file): a fresh clone
          # stamps "now" on everything, which makes Xcode's incremental build
          # database treat every file as changed and defeats the DerivedData
          # cache. With commit-time mtimes, unchanged files keep identical
          # stats across runs and skip recompilation.
          python3 - <<'PY'
          import subprocess, os
          # Newest-first walk of the log; the first commit that names a file
          # is that file's last change. Format record and file list are read
          # as separate lines, which sidesteps -z quirks entirely.
          stamped = {}
          current = None
          log = subprocess.check_output(
              ["git", "log", "--format=commit:%ct", "--name-only"]
          ).decode("utf-8", "replace")
          for line in log.splitlines():
              if line.startswith("commit:"):
                  current = int(line[7:])
              elif line and current is not None and line not in stamped:
                  stamped[line] = current
          restored = 0
          for path, ts in stamped.items():
              try:
                  os.utime(path, (ts, ts))
                  restored += 1
              except OSError:
                  pass
          print(f"restored mtimes for {restored} files")
          PY

      - name: Resolve project flags
        id: proj
        working-directory: src
        run: |
          P="${{ inputs.project_path }}"
          test -e "$P" || { echo "::error::$P not found in repo"; exit 1; }
          case "$P" in
            *.xcworkspace) echo "flag=-workspace" >> "$GITHUB_OUTPUT" ;;
            *.xcodeproj)   echo "flag=-project"   >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::project_path must end in .xcodeproj or .xcworkspace"; exit 1 ;;
          esac
          echo "dir=$(dirname "$P")" >> "$GITHUB_OUTPUT"

      - name: Compute version and changelog
        id: ver
        working-directory: src
        run: |
          # Monotonic and reproducible: the same commit always yields the same build number.
          BUILD_NUM=$(git rev-list --count HEAD)
          SHA=$(git rev-parse --short HEAD)
          echo "build=$BUILD_NUM" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          # Marketing version comes from the tag when building one; otherwise leave the project alone.
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
            TAG=$(git describe --exact-match --tags HEAD)
            echo "marketing=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "marketing=" >> "$GITHUB_OUTPUT"
          fi

          PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV" ]; then
            echo "Changes since $PREV:" > "$RUNNER_TEMP/changelog.md"
            git log --no-merges --pretty='- %s' "$PREV"..HEAD >> "$RUNNER_TEMP/changelog.md"
          else
            echo "Recent changes:" > "$RUNNER_TEMP/changelog.md"
            git log --no-merges --pretty='- %s' -20 >> "$RUNNER_TEMP/changelog.md"
          fi

          # TestFlight caps "What to Test" at 4000 characters.
          head -c 3900 "$RUNNER_TEMP/changelog.md" > "$RUNNER_TEMP/changelog.trunc.md"
          mv "$RUNNER_TEMP/changelog.trunc.md" "$RUNNER_TEMP/changelog.md"

          {
            echo "### ${{ inputs.app_name }} — build $BUILD_NUM (\`$SHA\`)"
            echo
            cat "$RUNNER_TEMP/changelog.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.SPM_CACHE }}
          key: spm-${{ inputs.app_name }}-${{ hashFiles('src/**/Package.resolved') }}
          restore-keys: spm-${{ inputs.app_name }}-

      # DerivedData across runs: the run_id key never exact-hits, so every run
      # restores the newest previous cache (restore-keys) and saves its own —
      # combined with commit-time mtimes above, unchanged Swift files skip
      # recompilation entirely. If a cache ever goes weird, bump the "dd1"
      # prefix to bust it.
      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/DerivedData
          key: dd1-${{ inputs.app_name }}-${{ inputs.xcode_version }}-${{ github.run_id }}
          restore-keys: dd1-${{ inputs.app_name }}-${{ inputs.xcode_version }}-

      - name: Resolve dependencies
        working-directory: src
        run: |
          xcodebuild -resolvePackageDependencies \
            ${{ steps.proj.outputs.flag }} "${{ inputs.project_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -clonedSourcePackagesDirPath "$SPM_CACHE"

      - name: Test
        if: inputs.run_tests
        working-directory: src
        run: |
          set -o pipefail
          # Pick the newest-runtime iPhone simulator actually present on this
          # image — device names churn with every Xcode release.
          UDID=$(xcrun simctl list devices available --json | jq -r '
            [.devices | to_entries[]
             | select(.key | contains("iOS"))
            ] | sort_by(.key) | reverse
              | .[].value[] | select(.name | startswith("iPhone")) | .udid' | head -n 1)
          test -n "$UDID" || { echo "::error::no iPhone simulator on this image"; xcrun simctl list devices available; exit 1; }
          echo "Testing on simulator $UDID"
          xcodebuild test \
            ${{ steps.proj.outputs.flag }} "${{ inputs.project_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -clonedSourcePackagesDirPath "$SPM_CACHE" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -resultBundlePath "$RUNNER_TEMP/${{ inputs.app_name }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            | tee -a "$RUNNER_TEMP/build.log"


      # ---------- compile-only path ----------
      - name: Build (no signing)
        if: ${{ !inputs.upload && !inputs.run_tests }}
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild build \
            ${{ steps.proj.outputs.flag }} "${{ inputs.project_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -destination 'generic/platform=iOS' \
            -clonedSourcePackagesDirPath "$SPM_CACHE" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee -a "$RUNNER_TEMP/build.log"

      # ---------- release path ----------
      - name: Write App Store Connect credentials
        if: inputs.upload
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          # .p8 on disk for xcodebuild's automatic signing
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          # JSON form for fastlane. jq handles the newline escaping in the key body.
          jq -n \
            --arg kid "$ASC_KEY_ID" \
            --arg iss "$ASC_ISSUER_ID" \
            --arg key "$ASC_KEY_P8" \
            '{key_id:$kid, issuer_id:$iss, key:$key, duration:1200, in_house:false}' \
            > "$RUNNER_TEMP/asc_key.json"
          chmod 600 "$RUNNER_TEMP/asc_key.json"

      # agvtool is not used for this and cannot be. It looks for INFOPLIST_FILE
      # without excluding GENERATE_INFOPLIST_FILE, so on a project using the
      # generated plist it tries to open one literally named "YES" - hence
      # `Cannot find ".../YES"` in older logs - and new-marketing-version then
      # fails to update the project setting at all. It edits the on-disk
      # Info.plist instead, which the generated one overrides, so the tag was
      # stamped nowhere that mattered: v1.5.2 shipped to App Store Connect as
      # "1.5.1 - 41", the stale MARKETING_VERSION left in project.pbxproj.
      # https://github.com/fastlane/fastlane/discussions/20062
      #
      # Build settings passed on the xcodebuild command line beat the project
      # file, need no tool, and cannot half-apply. Set below on Archive.
      - name: Version to stamp
        if: inputs.upload
        id: stamp
        run: |
          ARGS="CURRENT_PROJECT_VERSION=${{ steps.ver.outputs.build }}"
          if [ -n "${{ steps.ver.outputs.marketing }}" ]; then
            ARGS="$ARGS MARKETING_VERSION=${{ steps.ver.outputs.marketing }}"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "stamping: $ARGS"

      # Supply the team's distribution certificate, so automatic signing does not
      # go and mint another one.
      #
      # Automatic signing reuses a distribution identity only if the certificate
      # *and its private key* are already in a keychain it can see. A hosted
      # runner starts with neither, so xcodebuild -allowProvisioningUpdates,
      # holding an ASC key entitled to create certificates, does the obvious
      # thing: generates a keypair and issues a brand new Apple Distribution
      # certificate. Once per upload run, forever, until the team hits Apple's
      # cap and signing starts failing for everyone.
      #
      # Certificates are the scarce resource here and they belong to the *team*,
      # so one secret covers every app this workflow builds. Provisioning
      # profiles are free, unlimited and per-app, and automatic profile
      # management is what makes entitlements work at all (see Show signed
      # entitlements below) - so keep -allowProvisioningUpdates and let it
      # handle profiles only.
      #
      # A throwaway keychain, never the login keychain: created here, added to
      # the search list so xcodebuild can find it, destroyed in Scrub
      # credentials.
      - name: Install distribution certificate
        if: inputs.upload
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_P12_PASSWORD: ${{ secrets.DIST_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${DIST_CERT_P12_BASE64:-}" ]; then
            echo "::warning::No DIST_CERT_P12_BASE64 secret is set, so automatic signing will create a NEW Apple Distribution certificate for this run, as it has for every run before it. Apple caps how many a team may hold. Add the certificate as a secret to stop this."
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          printf '%s' "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Do not let it re-lock mid-build; the runner is torn down anyway.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" \
            -P "$DIST_CERT_P12_PASSWORD" -A -t cert -f pkcs12 >/dev/null
          # Without this codesign blocks on a UI authorisation prompt that no one
          # is there to answer, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # Prepend, keeping the existing list - dropping the system keychain
          # breaks certificate chain validation.
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dist.p12"

          # If this prints "0 valid identities found", the import silently did
          # nothing and the run is about to create a certificate regardless.
          echo "signing identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN"

          # Distribution certificates last a year, and this one signs every app
          # built by this workflow - so the day it lapses, all of them stop
          # signing at once, with an error that points at Xcode rather than
          # here. Say so with a month's notice.
          #
          # Read back from the keychain as PEM rather than parsing the .p12:
          # `openssl x509` behaves the same on the runner's LibreSSL and on an
          # OpenSSL 3 that Homebrew may have put earlier in PATH, whereas
          # reading a legacy-encrypted PKCS#12 does not. `-checkend` avoids
          # date arithmetic, which is where this would otherwise go wrong first
          # (BSD date takes different arguments from GNU date).
          security find-certificate -c "Apple Distribution" -p "$KEYCHAIN" \
            > "$RUNNER_TEMP/signing-cert.pem"
          EXPIRY=$(openssl x509 -in "$RUNNER_TEMP/signing-cert.pem" -noout -enddate | cut -d= -f2)
          echo "distribution certificate expires: $EXPIRY"

          if ! openssl x509 -in "$RUNNER_TEMP/signing-cert.pem" -noout -checkend 0 >/dev/null 2>&1; then
            echo "::error::The distribution certificate expired on $EXPIRY. Every app this workflow builds will fail to sign until it is replaced. Issue a new Apple Distribution certificate and update DIST_CERT_P12_BASE64 and DIST_CERT_P12_PASSWORD."
            exit 1
          elif ! openssl x509 -in "$RUNNER_TEMP/signing-cert.pem" -noout -checkend 2592000 >/dev/null 2>&1; then
            echo "::warning::The distribution certificate expires on $EXPIRY, within 30 days. It signs every app this workflow builds, so all of them stop on that date. Issue a replacement and update DIST_CERT_P12_BASE64 and DIST_CERT_P12_PASSWORD before then."
          fi
          rm -f "$RUNNER_TEMP/signing-cert.pem"

      - name: Archive
        if: inputs.upload
        working-directory: src
        run: |
          set -o pipefail
          xcodebuild archive \
            ${{ steps.proj.outputs.flag }} "${{ inputs.project_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/${{ inputs.app_name }}.xcarchive" \
            -clonedSourcePackagesDirPath "$SPM_CACHE" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="${{ secrets.TEAM_ID }}" \
            ${{ steps.stamp.outputs.args }} \
            | tee -a "$RUNNER_TEMP/build.log"


      - name: Export IPA
        if: inputs.upload
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.TEAM_ID }}</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/${{ inputs.app_name }}.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      # What the IPA is actually signed with. Entitlements are applied at
      # signing time, so archiving unsigned - as this did until now - produced
      # an app that requested none, and -exportArchive happily re-signed it that
      # way. Tembed's hotspot join failed with NEHotspotConfigurationError 8 for
      # exactly that reason, and nothing in CI said a word. Cheap to print.
      - name: Show signed entitlements
        if: inputs.upload
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)
          rm -rf "$RUNNER_TEMP/unz" && mkdir -p "$RUNNER_TEMP/unz"
          unzip -q -o "$IPA" -d "$RUNNER_TEMP/unz"
          APP=$(find "$RUNNER_TEMP/unz/Payload" -maxdepth 1 -name '*.app' | head -1)
          codesign -d --entitlements :- "$APP" 2>/dev/null || true

      # Upload only — don't hold the job hostage to Apple's processing queue.
      # Waiting for processing, writing "What to Test", and assigning groups
      # happen in the best-effort step below; an ASC hiccup there is a warning,
      # not a red run.
      - name: Upload to TestFlight
        if: inputs.upload
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          SPACESHIP_SKIP_2FA_UPGRADE: "1"
        run: |
          IPA=$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)
          test -n "$IPA" || { echo "::error::no .ipa produced"; exit 1; }
          echo "$IPA" > "$RUNNER_TEMP/ipa_path"

          fastlane run upload_to_testflight \
            ipa:"$IPA" \
            api_key_path:"$RUNNER_TEMP/asc_key.json" \
            skip_waiting_for_build_processing:true

      # Distribution is a separate step from the changelog, and it is the one
      # that matters.
      #
      # `Upload to TestFlight` above passes skip_waiting_for_build_processing,
      # so it only uploads - it does not hand the build to anybody. Assigning it
      # to testers happens here, and until it does the build sits in App Store
      # Connect fully processed and visible to nobody, which looks exactly like
      # a release that never happened.
      #
      # These two jobs used to share one step, and one timeout killed both. A
      # slow processing queue then cost the build itself rather than just its
      # release notes, silently, because the step was marked continue-on-error
      # on the assumption that release notes were all it did.
      #
      # Retried, because the only reason it fails in practice is App Store
      # Connect still processing - and the fix for that is to ask again. Three
      # attempts of ten minutes bounds it at half an hour rather than the six
      # hour runner limit an unbounded wait allowed.
      - name: Distribute to testers
        if: inputs.upload
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          SPACESHIP_SKIP_2FA_UPGRADE: "1"
        run: |
          IPA=$(cat "$RUNNER_TEMP/ipa_path")
          GROUPS="${{ inputs.testflight_groups }}"

          # NOTE: never pass boolean:false args to `fastlane run` — CLI values
          # arrive as strings and Ruby treats "false" as truthy. That is exactly
          # how distribute_external:false kept triggering external beta review
          # (and its Beta App Description requirement) on every release.
          ARGS=(
            ipa:"$IPA"
            api_key_path:"$RUNNER_TEMP/asc_key.json"
            distribute_only:true
            build_number:"${{ steps.ver.outputs.build }}"
            wait_processing_timeout_duration:600
          )

          if [ -n "$GROUPS" ]; then
            ARGS+=( distribute_external:true groups:"$GROUPS" )
          fi

          # Beta App Description is an app-level field in App Store Connect's
          # Test Information, and Apple requires it before a build reaches
          # *external* testers. Passing it lets fastlane create the
          # betaAppLocalization rather than needing someone to fill the field in
          # by hand once per app.
          if [ -n "${{ inputs.beta_app_description }}" ]; then
            ARGS+=( beta_app_description:"${{ inputs.beta_app_description }}" )
          fi
          if [ -n "${{ inputs.beta_app_feedback_email }}" ]; then
            ARGS+=( beta_app_feedback_email:"${{ inputs.beta_app_feedback_email }}" )
          fi

          # Judged on the log, not the exit code. submit_beta_review defaults to
          # true, so fastlane tries to submit for *external* beta review after
          # distributing, and App Store Connect has rejected that without a Beta
          # App Description since Nov 2024 (fastlane/fastlane#28630, still open)
          # even when fastlane set the description moments earlier. That
          # rejection is noise here - internal testers get builds without it -
          # and it must not be allowed to mask a distribution that worked.
          distributed=
          for attempt in 1 2 3; do
            echo "distribution attempt $attempt of 3"
            set +e
            fastlane run upload_to_testflight "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/distribute.log"
            set -e
            if grep -q "Distributing new build to testers" "$RUNNER_TEMP/distribute.log"; then
              distributed=yes
              break
            fi
            echo "not distributed yet; App Store Connect is most likely still processing"
          done

          if [ -z "$distributed" ]; then
            echo "::error::The build uploaded but was never distributed, so it will not appear in TestFlight for anyone. App Store Connect was still processing after three attempts. The binary is fine - add it to your tester group by hand, or re-run this job once processing finishes."
            exit 1
          fi
          echo "distributed"

      # Genuinely optional, unlike the step this was split out of. By the time
      # it runs the build has already been distributed, so processing is
      # complete and this returns quickly rather than waiting on anything.
      - name: Set What to Test (best effort)
        if: inputs.upload
        continue-on-error: true
        env:
          FASTLANE_SKIP_UPDATE_CHECK: "1"
          FASTLANE_HIDE_CHANGELOG: "1"
          SPACESHIP_SKIP_2FA_UPGRADE: "1"
        run: |
          IPA=$(cat "$RUNNER_TEMP/ipa_path")
          CHANGELOG=$(cat "$RUNNER_TEMP/changelog.md")

          # Prove what is being sent. "What to Test" showing nothing has two
          # completely different causes - an empty changelog, or a changelog
          # that was set before a later step failed - and the log could not
          # tell them apart.
          echo "changelog: $(printf '%s' "$CHANGELOG" | wc -c) bytes"
          printf '%s\n' "$CHANGELOG" | head -5

          set +e
          fastlane run upload_to_testflight \
            ipa:"$IPA" \
            api_key_path:"$RUNNER_TEMP/asc_key.json" \
            distribute_only:true \
            build_number:"${{ steps.ver.outputs.build }}" \
            changelog:"$CHANGELOG" \
            wait_processing_timeout_duration:300 2>&1 | tee "$RUNNER_TEMP/pilot.log"
          set -e

          if grep -q "Successfully set the changelog" "$RUNNER_TEMP/pilot.log"; then
            echo "changelog set; ignoring any beta-review submission failure after it"
          else
            echo "::warning::The build is distributed and installable, but the changelog was not set, so What to Test will be empty."
          fi

      - name: Summarize release
        if: inputs.upload && success()
        run: |
          {
            echo
            echo "✅ **Shipped to TestFlight** — build \`${{ steps.ver.outputs.build }}\`"
            if [ -n "${{ steps.ver.outputs.marketing }}" ]; then
              echo "Version \`${{ steps.ver.outputs.marketing }}\`"
            fi
            if [ -n "${{ inputs.testflight_groups }}" ]; then
              echo "Distributed to: ${{ inputs.testflight_groups }}"
            else
              echo "Internal testers only"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------- diagnostics ----------
      # Compiler/test errors become check-run annotations, which are readable
      # through the public API — so failures can be diagnosed without log access.
      - name: Surface build errors
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/build.log" ]; then
            grep -E "error: |Testing failed|\*\* TEST FAILED| failed \(" "$RUNNER_TEMP/build.log" \
              | sort -u | head -10 \
              | while IFS= read -r line; do
                  echo "::error::${line}"
                done
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_name }}-${{ steps.ver.outputs.build || 'unknown' }}
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/changelog.md
            ${{ runner.temp }}/*.xcresult
          if-no-files-found: ignore
          retention-days: 14

      - name: Scrub credentials
        if: always()
        run: |
          rm -rf ~/.appstoreconnect "$RUNNER_TEMP/asc_key.json" src
          # Take the signing keychain out of the search list before deleting it,
          # so a reused runner is not left pointing at a keychain that is gone.
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then
            security list-keychains -d user -s \
              $(security list-keychains -d user | tr -d '"' | grep -v signing.keychain || true)
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          fi
          rm -f "$RUNNER_TEMP/dist.p12"
